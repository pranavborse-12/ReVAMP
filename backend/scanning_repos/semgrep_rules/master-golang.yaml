- id: go.mcp.mcp-shell-injection-taint.mcp-shell-injection-taint
  message: 'Detected MCP server data flowing into a shell command execution function.

    This could result in a command injection vulnerability if an attacker can control

    the HTTP request data, MCP configuration, or tool parameters. MCP servers handle

    external requests and should treat all input data as untrusted. An attacker could

    inject malicious commands to execute arbitrary code on the server.


    To fix this:

    1. Avoid using exec.Command() with shell interpreters (sh, bash, etc.)

    2. Use exec.Command() with specific commands and validate arguments

    3. Sanitize input using shellescape.Quote() if shell commands are necessary

    4. Validate and allowlist expected command patterns

    5. Consider using Go APIs instead of shell commands when possible

