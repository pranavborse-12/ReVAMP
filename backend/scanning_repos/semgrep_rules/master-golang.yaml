        version_id: qkTRrPP
        url: https://semgrep.dev/playground/r/qkTRrPP/go.net.sql.pg-sqli-taint.pg-sqli-taint
        origin: pro_rules
  languages:
  - go
  mode: taint
  min-version: 1.71.0
  pattern-sources:
  - label: USERINPUT
    patterns:
    - pattern: $REQ.$FIELD
    - metavariable-type:
        metavariable: $REQ
        types:
        - '*http.Request'
        - http.Request
    - metavariable-regex:
        metavariable: $FIELD
        regex: ^(BasicAuth|Body|Cookie|Cookies|Form|FormValue|GetBody|Host|Header|MultipartReader|ParseForm|ParseMultipartForm|PostForm|PostFormValue|Referer|RequestURI|Trailer|TransferEncoding|URL|UserAgent)$
  - label: USERINPUT
    patterns:
    - pattern-inside: 'import "github.com/gin-gonic/gin"

        ...

        '
    - pattern-either:
      - patterns:
        - pattern: $CONTEXT.$FIELD
        - metavariable-type:
            metavariable: $CONTEXT
            types:
            - '*gin.Context'
            - gin.Context
        - metavariable-regex:
            metavariable: $FIELD
            regex: ^(Cookie|DefaultPostForm|DefaultQuery|FormFile|GetHeader|GetPostForm|GetPostFormArray|GetPostFormMap|GetQuery|GetQueryArray|GetQueryMap|GetRawData|MultipartForm|Param|Params|PostForm|PostFormArray|PostFormMap|Query|QueryArray|QueryMap)$
      - patterns:
        - pattern: $CONTEXT.Request.URL.Query().Get(...)
        - metavariable-type:
            metavariable: $CONTEXT
            types:
            - '*gin.Context'
            - gin.Context
  - label: IMPORTSQL
    pattern-either:
    - pattern: 'import "database/sql"

        ...

        '
    - pattern: 'import "github.com/go-sql-driver/mysql"

        ...

        '
    - pattern: 'import "gorm.io/driver/mysql"

        ...

        '
    - pattern: 'import "gorm.io/driver/postgres"

        ...

        '
    - pattern: 'import "gorm.io/driver/clickhouse"

        ...

        '
  - label: SPRINTF
    patterns:
    - pattern-inside: 'import "fmt"

        ...

        '
    - pattern: fmt.$P("...", $REQ, ...)
    - metavariable-regex:
        metavariable: $P
        regex: ^(Sprint|Sprintf|Sprintln)$
    requires: USERINPUT
  - label: CONCAT
    pattern-either:
    - pattern: '"$A" + $B

        '
    - pattern: $A + "$B"
    - pattern: '"$A" += $B

        '
    - pattern: $A += "$B"
    requires: USERINPUT
  - label: PREPARE
    patterns:
    - pattern-either:
      - pattern: $DB.Prepare(...)
      - pattern: $DB.SafeQuery(...)
    - metavariable-type:
        metavariable: $DB
        types:
        - '*sql.Conn'
        - '*sql.DB'
        - '*sql.Tx'
        - sql.Conn
        - sql.DB
        - sql.Tx
    requires: IMPORTSQL and USERINPUT and (CONCAT or SPRINTF)
  - label: PREPARECONN
    patterns:
    - patterns:
      - pattern-either:
        - pattern-inside: '$DB := sql.$OPEN(...)

            ...

            '
        - pattern-inside: '$DB, ... := sql.$OPEN(...)

            ...

            '
      - metavariable-regex:
          metavariable: $OPEN
          regex: ^(Open|OpenDB)$
    - pattern-either:
      - pattern: $DB.Prepare(...)
      - pattern: $DB.SafeQuery(...)
    requires: IMPORTSQL and USERINPUT and (CONCAT or SPRINTF)
  - label: IMPORTPG
    patterns:
    - pattern-inside: 'import "$IMPORT"

        ...

        '
    - metavariable-regex:
        metavariable: $IMPORT
        regex: ^(.*go\-pg\/pg\/v10\/orm.*)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern: '($DB : $DBTYPE). ... .$METHOD($QUERY, ...)

            '
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(Exec|ExecOne|Prepare)$
      - patterns:
        - pattern: '($DB : $DBTYPE). ... .$METHOD($MDL_CTX_WRITER, $QUERY, ...)

            '
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(CopyFrom|CopyTo|ExecContext|ExecOneContext|Query|QueryOne)$
      - patterns:
        - pattern: '($DB : $DBTYPE). ... .$METHOD($CTX, $MODEL, $QUERY, ...)

            '
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(QueryContext|QueryOneContext)$
    - pattern-not: $DB. ... .Prepare("..."). ... .$METHOD(...)
    - metavariable-regex:
        metavariable: $DBTYPE
        regex: ^((\*)?pg.(Conn|DB|Tx))$
    - focus-metavariable: $QUERY
    requires: IMPORTPG and USERINPUT and (CONCAT or SPRINTF)
  - patterns:
    - patterns:
      - pattern-either:
        - pattern: '$DB := pg.$CONN(...)

            ...

            '
        - pattern: '$DB, $ERR := pg.$CONN(...)

            ...

            '
      - metavariable-regex:
          metavariable: $CONN
          regex: ^(Connect|ParseURL)$
    - patterns:
      - pattern-either:
        - patterns:
          - pattern: $DB. ... .$METHOD($QUERY, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(Exec|ExecOne|Prepare)$
        - patterns:
          - pattern: $DB. ... .$METHOD($MDL_CTX_WRITER, $QUERY, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CopyFrom|CopyTo|ExecContext|ExecOneContext|Query|QueryOne)$
        - patterns:
          - pattern: $DB. ... .$METHOD($CTX, $MODEL, $QUERY, ...)
          - metavariable-regex:
              metavariable: $METHOD
